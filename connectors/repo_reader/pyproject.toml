[project]
name = "baranda-repo-reader"
version = "0.1.0"
description = "baranda connector: read-only exploration of a git repository over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["baranda[mcp]"]

[project.scripts]
baranda-repo-reader = "baranda_repo_reader.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baranda_repo_reader"]

[tool.uv.sources]
baranda = { workspace = true }
