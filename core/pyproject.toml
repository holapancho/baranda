[project]
name = "baranda"
version = "0.1.0"
description = "Deterministic guardrails for AI agent tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6",
    "opentelemetry-api>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baranda"]
