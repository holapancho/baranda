name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - name: Install CLI tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Install CLI tools (macOS)
        if: runner.os == 'macOS'
        run: brew install git ripgrep jq

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Tool versions
        run: |
          git --version
          rg --version | head -1
          uv run python --version

      - name: Test
        run: uv run pytest

  docker:
    name: docker images (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Build images
        run: docker compose build

      - name: Smoke test over stdio (docker run -i, read-only mount, no network)
        run: uv run python scripts/docker_smoke.py stdio

      - name: Start the stack
        run: docker compose up -d repo-reader jaeger

      - name: Smoke test over HTTP, and spans in Jaeger
        run: uv run python scripts/docker_smoke.py http

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
