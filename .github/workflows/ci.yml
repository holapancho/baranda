name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - name: Install CLI tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Install CLI tools (macOS)
        if: runner.os == 'macOS'
        run: brew install git ripgrep jq

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Tool versions
        run: |
          git --version
          rg --version | head -1
          uv run python --version

      - name: Test
        run: uv run pytest
