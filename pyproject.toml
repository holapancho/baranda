[project]
name = "baranda-workspace"
version = "0.0.0"
description = "Development workspace for baranda."
requires-python = ">=3.11"
dependencies = [
    "baranda[mcp,otel]",
    "baranda-repo-reader",
    "google-adk[mcp,a2a]>=2.14,<3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "connectors/*"]

[tool.uv.sources]
baranda = { workspace = true }
baranda-repo-reader = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "connectors", "agents/tests"]
addopts = "-ra"
