[project]
name = "baranda-workspace"
version = "0.0.0"
description = "Development workspace for baranda."
requires-python = ">=3.11"
dependencies = ["baranda"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core"]

[tool.uv.sources]
baranda = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
addopts = "-ra"
